<style>
  :root {
    --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  html { background: #080910; scroll-behavior: smooth; }
  body {
    background: #080910;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top);
    overflow-x: hidden;
  }

  .ambient-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(55% 45% at 15% 10%, rgba(124, 58, 237, 0.18), transparent 70%),
      radial-gradient(50% 45% at 88% 25%, rgba(34, 211, 238, 0.12), transparent 70%),
      radial-gradient(60% 50% at 50% 90%, rgba(168, 85, 247, 0.14), transparent 75%);
  }

  .glass {
    background: linear-gradient(145deg, rgba(25, 28, 48, 0.62), rgba(19, 21, 36, 0.42));
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(168, 85, 247, 0.22);
    box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 8px 24px -6px rgba(0, 0, 0, 0.45);
    transition: transform 0.3s var(--ease-spring), background 0.3s ease, border-color 0.3s ease, box-shadow 0.35s var(--ease-spring);
  }
  .glass:hover {
    background: linear-gradient(145deg, rgba(124, 58, 237, 0.22), rgba(19, 21, 36, 0.7));
    border-color: rgba(168, 85, 247, 0.55);
    box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25), 0 12px 32px -4px rgba(124, 58, 237, 0.35);
  }
  .glass:active {
    transform: scale(0.95);
  }

  .violet-grad {
    background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 28px rgba(124, 58, 237, 0.55), 0 0 60px rgba(168, 85, 247, 0.28);
    transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-spring), filter 0.3s ease;
  }
  .violet-grad:hover {
    transform: translateY(-3px) scale(1.04);
    filter: brightness(1.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 0 38px rgba(168, 85, 247, 0.75), 0 0 85px rgba(34, 211, 238, 0.35);
  }
  .violet-grad:active {
    transform: scale(0.95);
  }

  .item-selected {
    background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%) !important;
    color: #fff !important;
    border-color: rgba(34, 211, 238, 0.75) !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 24px -2px rgba(124, 58, 237, 0.65), 0 0 18px rgba(34, 211, 238, 0.35) !important;
    transform: translateY(-2px) scale(1.04);
  }

  .btn-motion {
    transition: transform 0.3s var(--ease-spring), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s var(--ease-spring);
  }
  .btn-motion:hover {
    transform: translateY(-2px);
  }
  .btn-motion:active {
    transform: scale(0.94);
  }

  .card {
    transition: transform 0.38s var(--ease-spring);
  }
  .card .poster-shell {
    transition: border-color 0.35s ease, box-shadow 0.38s var(--ease-spring);
  }
  .card img {
    transition: transform 0.45s var(--ease-spring);
  }
  .card:hover {
    transform: translateY(-6px) scale(1.045);
    z-index: 5;
  }
  .card:hover .poster-shell {
    border-color: rgba(168, 85, 247, 0.75);
    box-shadow: 0 16px 36px -8px rgba(124, 58, 237, 0.55), 0 0 22px rgba(34, 211, 238, 0.3);
  }
  .card:hover img {
    transform: scale(1.06);
  }
  .card:active {
    transform: scale(0.96);
  }

  /* Hiệu ứng chuyển động mạnh mẽ cho Hero Deck */
  .deck-card {
    transition: transform 0.35s var(--ease-spring), border-color 0.3s ease, box-shadow 0.35s var(--ease-spring), opacity 0.3s ease, filter 0.3s ease;
    opacity: 0.55;
    filter: saturate(80%);
  }
  .deck-card:hover {
    opacity: 0.9;
    transform: translateY(-4px) scale(1.03);
    filter: saturate(100%);
  }
  .deck-card.active {
    opacity: 1;
    transform: translateY(-7px) scale(1.08);
    border-color: rgba(34, 211, 238, 0.95) !important;
    box-shadow: 0 14px 32px -4px rgba(124, 58, 237, 0.75), 0 0 20px rgba(34, 211, 238, 0.55);
    filter: saturate(110%) brightness(1.05);
    z-index: 10;
  }

  /* Hiệu ứng mờ dần (Fade & Zoom) khi chuyển cảnh Hero Banner */
  @keyframes heroFadeIn {
    from { opacity: 0.3; transform: scale(1.03); }
    to { opacity: 1; transform: scale(1); }
  }
  .hero-animate {
    animation: heroFadeIn 0.55s var(--ease-spring) forwards;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .hero-mask { -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); }

  #nav {
    transition: background 0.35s ease, backdrop-filter 0.35s ease, border-color 0.35s ease;
    border-bottom: 1px solid transparent;
    padding-top: env(safe-area-inset-top);
  }
  #nav.scrolled {
    background: rgba(8, 9, 16, 0.75);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%);
    border-bottom-color: rgba(168, 85, 247, 0.28);
    box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.7);
  }
  #sbox { transition: width 0.35s var(--ease-spring), opacity 0.25s ease; }

  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  #dim { opacity: 0; pointer-events: none; transition: opacity .5s; }
  body.cinema #dim { opacity: 1; pointer-events: auto; }

  #pbox {
    aspect-ratio: var(--vid-ar, 16 / 9);
    width: min(100%, calc(82vh * var(--vid-ratio, 1.7778)));
    width: min(100%, calc(82dvh * var(--vid-ratio, 1.7778)));
    margin-inline: auto;
    transition: width 0.35s var(--ease-spring), aspect-ratio 0.35s var(--ease-spring);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<script>
(() => {
'use strict';
const DEFAULT_SHEET_ID = '1IKTN4-IQVx8Pg239GnR6b4oF4D2LPXXg';

/* ---------- Xử lý & định dạng Ngày update cuối (Option 3) ---------- */
function parseSheetDate(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  const s = String(raw).trim();
  if (!s) return null;

  let m = s.match(/^Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/i);
  if (m) {
    const d = new Date(+m[1], +m[2], +m[3]);
    if (!isNaN(d.getTime())) return d;
  }

  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:\s.*)?$/);
  if (m) {
    let yr = +m[3];
    if (yr < 100) yr += 2000;
    const d = new Date(yr, +m[2] - 1, +m[1]);
    if (!isNaN(d.getTime())) return d;
  }

  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[T\s].*)?$/);
  if (m) {
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (!isNaN(d.getTime())) return d;
  }

  return null;
}

function formatDateInfo(raw) {
  const d = parseSheetDate(raw);
  if (!d) {
    const fallback = String(raw || '').trim();
    return { ts: 0, short: fallback, full: fallback, isNew: false };
  }
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  const yy = String(yyyy).slice(-2);

  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const dateStart = new Date(yyyy, d.getMonth(), d.getDate()).getTime();
  const diffDays = Math.round((todayStart - dateStart) / 86400000);

  const fullStr = `${dd}/${mm}/${yyyy}`;
  const compactStr = `${dd}/${mm}/${yy}`;
  const isNew = diffDays >= 0 && diffDays <= 7;

  let shortStr = compactStr;
  if (diffDays === 0) shortStr = 'Hôm nay';
  else if (diffDays === 1) shortStr = 'Hôm qua';
  else if (diffDays > 1 && diffDays <= 7) shortStr = `${diffDays} ngày trước`;

  return { ts: dateStart, short: shortStr, full: fullStr, isNew };
}

/* ---------- Helpers: IDs & images ---------- */
function fid(u) {
  if (!u) return ''; u = String(u).trim();
  const m = u.match(/\/d\/([\w-]{10,})/) || u.match(/[?&]id=([\w-]{10,})/) || u.match(/\/folders\/([\w-]{10,})/);
  if (m) return m[1];
  return /^[\w-]{15,}$/.test(u) ? u : '';
}
const thumb = (id, w) => id ? `https://lh3.googleusercontent.com/d/${id}=w${w}` : '';
const thumbAlt = (id, w) => id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : '';
function imgUrl(u, w) {
  u = String(u || '').trim(); if (!u) return '';
  if (/drive\.google\.com|docs\.google\.com/.test(u)) return thumb(fid(u), w);
  return /^https?:\/\//.test(u) ? u : '';
}
function gen(title, w, h) {
  let hash = 0; for (const c of title) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  const hue = 255 + (hash % 45), words = title.split(/\s+/), lines = []; let cur = '';
  words.forEach(wd => { if ((cur + ' ' + wd).trim().length > 12 && cur) { lines.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); });
  if (cur) lines.push(cur);
  const fs = Math.round(w / 9), y0 = h / 2 - ((lines.length - 1) * fs * 0.6);
  const tsp = lines.slice(0, 4).map((l, i) => `<tspan x='50%' y='${y0 + i * fs * 1.2}'>${esc(l)}</tspan>`).join('');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},65%,32%)'/><stop offset='1' stop-color='#080910'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/><text text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='${fs}' fill='rgba(255,255,255,.88)'>${tsp}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
window.imgFail = (el) => {
  const list = (el.dataset.fb || '').split('|').filter(Boolean);
  if (list.length) { el.dataset.fb = list.slice(1).join('|'); el.src = list[0]; }
  else { el.onerror = null; el.src = el.dataset.gen; }
};
function img(src, fbs, genSrc, cls, alt) {
  const first = src || fbs.find(Boolean) || genSrc;
  const rest = (src ? fbs : fbs.slice(1)).filter(Boolean).join('|');
  return `<img src="${esc(first)}" data-fb="${esc(rest)}" data-gen="${genSrc}" onerror="imgFail(this)" alt="${esc(alt)}" class="${cls}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
}

function parseRows(rows) {
  const map = new Map(), headRe = /^(tên phim|ten phim|name|title|phim)$/i;
  let seq = 0;
  rows.forEach(r => {
    const g = (i) => (r[i] === null || r[i] === undefined) ? '' : String(r[i]).trim();
    const title = g(0); if (!title || headRe.test(title)) return;
    const key = title.toLowerCase();
    let m = map.get(key);
    if (!m) {
      m = { key, title, genres: [], dateInfo: { ts: 0, short: '', full: '', isNew: false }, rating: '', poster: '', backdrop: '', desc: '', eps: [], order: seq++ };
      map.set(key, m);
    }
    m.lastOrder = seq++;
    g(1).split(/[,;|\/]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!m.genres.some(y => y.toLowerCase() === x.toLowerCase())) m.genres.push(x); });

    if (g(2)) {
      const info = formatDateInfo(g(2));
      if (!m.dateInfo.full || info.ts >= m.dateInfo.ts) {
        m.dateInfo = info;
      }
    }

    if (!m.rating && g(3)) m.rating = g(3).replace(',', '.');
    if (!m.poster) m.poster = imgUrl(g(4), 500);
    if (!m.backdrop) m.backdrop = imgUrl(g(5), 1280);
    if (!m.desc && g(8)) m.desc = g(8);
    const id = fid(g(6)); if (id) m.eps.push({ name: g(7), id });
  });
  return [...map.values()].map(m => {
    m.eps.forEach((e, i) => { if (!e.name) e.name = m.eps.length > 1 ? 'Tập ' + (i + 1) : 'Full'; });
    const id0 = m.eps[0]?.id || '';
    m.pFb = [thumb(id0, 500), thumbAlt(id0, 500)]; m.bFb = [m.poster ? imgUrl(m.poster, 1280) : '', thumb(id0, 1280), thumbAlt(id0, 1280)];
    m.pGen = gen(m.title, 400, 600); m.bGen = gen(m.title, 1280, 720);
    return m;
  });
}

function rowsFromJson(json) {
  if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || json.errors?.[0]?.message || 'Lỗi Sheet');
  return (json.table?.rows || []).map(row => Array.from({ length: 9 }, (_, i) => { const c = row.c?.[i]; return c ? (c.v ?? c.f ?? '') : ''; }));
}
function viaFetch(id) {
  return fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`).then(async res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
    if (a < 0 || b < 0) throw new Error('Phản hồi không phải dữ liệu Sheet');
    return rowsFromJson(JSON.parse(txt.slice(a, b + 1)));
  });
}
function viaScript(id) {
  return new Promise((resolve, reject) => {
    const cb = '__pcCb' + Date.now(), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('Google không trả dữ liệu sau 10 giây')); }, 10000);
    window[cb] = (json) => { done(); try { resolve(rowsFromJson(json)); } catch (e) { reject(e); } };
    s.onerror = () => { done(); reject(new Error('Không tải được script từ Google')); };
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
async function fetchSheet(id) {
  const errs = [];
  for (const [name, fn] of [['fetch', viaFetch], ['script', viaScript]]) {
    try { return await fn(id); } catch (e) { errs.push(name + ': ' + e.message); }
  }
  throw new Error(errs.join(' | '));
}

/* ---------- Filtering, Sorting & Pagination ---------- */
const isFav = (k) => S.favs.includes(k);

function filtered() {
  const q = S.q.trim().toLowerCase();
  const list = S.movies.filter(m => {
    if (S.filter === 'fav' && !isFav(m.key)) return false;
    return !q || m.title.toLowerCase().includes(q) || m.genres.some(g => g.toLowerCase().includes(q));
  });

  if (S.filter === 'fav') {
    return list.sort((a, b) => S.favs.indexOf(a.key) - S.favs.indexOf(b.key));
  }
  if (S.filter === 'recent') {
    return list.sort((a, b) => (b.dateInfo.ts - a.dateInfo.ts) || (b.lastOrder - a.lastOrder));
  }
  return list.sort((a, b) => a.title.localeCompare(b.title, 'vi', { sensitivity: 'base' }));
}

/* ---------- Hero Banner & Hero Deck (Top 5 xem nhiều nhất) ---------- */
let heroTimer;
function top5MostViewed() {
  return [...S.movies]
    .filter(m => m.eps.length)
    .sort((a, b) => {
      const va = S.views[a.key] || 0, vb = S.views[b.key] || 0;
      if (vb !== va) return vb - va;
      const ra = parseFloat(a.rating) || 0, rb = parseFloat(b.rating) || 0;
      if (rb !== ra) return rb - ra;
      return a.order - b.order;
    })
    .slice(0, 5);
}

function stopHeroTimer() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }

    if (S.inWatch || S.filter !== 'all' || S.q.trim() || S.page !== 1) return;
    S.heroIdx = (S.heroIdx + 1) % total;

function renderPagination(totalPages) {
  const nav = $('#pagination');
  if (totalPages <= 1) {
    nav.innerHTML = '';
    return;
  }
  const cur = S.page;
  const btns = [];

  const pages = new Set([1]);
  if (totalPages >= 2) pages.add(2);
  if (totalPages >= 3) pages.add(3);
  if (cur > 1) pages.add(cur - 1);
  pages.add(cur);
  if (cur < totalPages) pages.add(cur + 1);

  const sorted = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);

  sorted.forEach((p, idx) => {
    if (idx > 0 && p - sorted[idx - 1] > 1) {
      btns.push(`<span class="px-1.5 text-sm font-semibold text-white/40">…</span>`);
    }
    const active = p === cur;
    btns.push(`<button type="button" data-page="${p}" class="btn-motion flex h-10 min-w-[2.5rem] items-center justify-center rounded-xl border px-3 text-sm font-bold ${active ? 'item-selected' : 'glass text-white/80'}">${p}</button>`);
  });

  if (cur < totalPages) {
    if (!sorted.includes(totalPages - 1) && !sorted.includes(totalPages)) {
      btns.push(`<span class="px-1 text-sm font-semibold text-white/40">…</span>`);
    }
    btns.push(`<button type="button" data-page="${totalPages}" class="glass btn-motion flex h-10 items-center gap-1.5 rounded-xl px-4 text-sm font-semibold text-cyanAccent"><span>Trang cuối (${totalPages})</span></button>`);
  }

  nav.innerHTML = btns.join('');
}

function renderGrid() {
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (S.page > totalPages) S.page = totalPages;
  if (S.page < 1) S.page = 1;

  const start = (S.page - 1) * PER_PAGE;
  const pageItems = list.slice(start, start + PER_PAGE);

  const titleMap = {
    all: 'Tất cả phim (A–Z)',
    fav: 'Phim yêu thích (Mới nhất)',
    recent: 'Mới cập nhật'

  $('#gridTitle span:last-child').textContent = S.q.trim() ? `Kết quả tìm kiếm: "${S.q.trim()}"` : (titleMap[S.filter] || 'Tất cả phim');
  $('#count').textContent = `${list.length} phim${totalPages > 1 ? ` • Trang ${S.page}/${totalPages}` : ''}`;

  $('#grid').innerHTML = pageItems.length
    ? pageItems.map(m => cardHTML(m)).join('')

function applyVideoRatio(w, h) {
  const box = $('#pbox');
  if (!w || !h) {
    box.style.setProperty('--vid-ar', '16 / 9');
    box.style.setProperty('--vid-ratio', '1.7778');
    return;
  }
  const ratio = Math.max(0.42, Math.min(2.4, w / h));
  box.style.setProperty('--vid-ar', `${w} / ${h}`);
  box.style.setProperty('--vid-ratio', ratio.toFixed(4));
}

function autoFitVideo() {
  if (!S.cur) return;
  const id = S.cur.eps[S.ep].id;
  const mKey = 'm:' + S.cur.key;
  const cached = S.ratios[id] || S.ratios[mKey];
  if (cached && cached.w && cached.h) {
    applyVideoRatio(cached.w, cached.h);
  } else {
    applyVideoRatio(16, 9);
  }
  if (id.startsWith('MOCK')) return;

  const tryProbe = (urls) => {
    if (!urls.length) return;
    const im = new Image();
    im.referrerPolicy = 'no-referrer';
    im.onload = () => {
      if (im.naturalWidth > 0 && im.naturalHeight > 0) {
        const dim = { w: im.naturalWidth, h: im.naturalHeight };
        S.ratios[id] = dim;
        S.ratios[mKey] = dim;
        save('pc_ratios', S.ratios);
        if (S.cur && S.cur.eps[S.ep].id === id) {
          applyVideoRatio(dim.w, dim.h);
        }
      }
    };
    im.onerror = () => tryProbe(urls.slice(1));
    im.src = urls[0];
  };
  tryProbe([thumb(id, 400), thumbAlt(id, 400)]);
}

function pickReco(m) {
  const mine = new Set(m.genres.map(g => g.toLowerCase()));
  const a = S.movies.filter(x => x.key !== m.key && x.eps.length);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const scored = a.map(x => ({ x, s: x.genres.filter(g => mine.has(g.toLowerCase())).length }));
  let pick = scored.filter(o => o.s > 0).sort((p, q) => q.s - p.s);
  if (!pick.length) pick = scored;
  return pick.slice(0, 10).map(o => o.x.key);
}

let entry = '';
function drawDots() {
  const spans = $('#dots').querySelectorAll('span');
  spans.forEach((sp, i) => {
    const on = i < entry.length;
    sp.classList.toggle('bg-cyanAccent', on);
    sp.classList.toggle('border-cyanAccent', on);
    sp.classList.toggle('scale-110', on);
    sp.style.boxShadow = on ? '0 0 12px rgba(34,211,238,0.75)' : '';

}
function press(k) {
  if (k === 'del') entry = entry.slice(0, -1); else if (entry.length < 4) entry += k;
  drawDots();
  if (entry.length === 4) {
    if (entry === S.pin) { ssSetRaw('pc_ok', '1'); unlock(); }
    else { const c = $('#lockCard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); setTimeout(() => { entry = ''; drawDots(); }, 350); }
  }
}
